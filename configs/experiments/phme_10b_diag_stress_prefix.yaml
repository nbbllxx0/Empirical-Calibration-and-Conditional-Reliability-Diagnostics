experiment_name: phme_10b_diag_stress_prefix
seed: 21
data:
  processed_dir: data/processed/phme_tvoc_10b
context:
  mode: load_speed
run:
  runs_dir: runs
split:
  strategy: leave_one_operating_regime_out
  seed: 101
model:
  type: digital_twin
  hidden: 96
  ensemble_size: 3
training:
  epochs: 120
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  patience: 18
  physics_weight: 0.0
  context_dropout: 0.5
  cuda: true
uncertainty:
  enabled: true
  alpha: 0.1
eval_subsets:
  - name: partial_20
    max_life_fraction: 0.2
  - name: partial_40
    max_life_fraction: 0.4
  - name: partial_60
    max_life_fraction: 0.6
  - name: partial_80
    max_life_fraction: 0.8
  - name: late_80
    min_life_fraction: 0.8
stress_tests:
  - name: noise_05
    signal_noise_std: 0.05
  - name: noise_10
    signal_noise_std: 0.1
  - name: missing_channel_0
    zero_channel: 0
  - name: raw_zero_retained_features
    zero_channel: 0
  - name: raw_zero_recomputed_features
    zero_channel: 0
    recompute_engineered_features: true
  - name: raw_and_engineered_removed
    zero_channel: 0
    zero_engineered_features: true
condition_response_tests:
  - name: high_load_speed
    context_scale: [1.25, 1.25]
